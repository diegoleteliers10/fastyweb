name: Refresh Site Data

# The site bakes the fasty version pill, star count, and release list at
# build time. This workflow keeps the deployed site current: it polls the
# fasty repo for a new release tag and pushes whenever the deployed site is
# behind. A push redeploys the site on whatever host is connected to the
# repo, and the new build pulls the full release data live from the GitHub
# API.
#
# Staleness is detected two ways, because either one alone can miss:
# - FALLBACK_VERSION in src/lib/repo.ts differs from the latest tag (the
#   fallback constant was not bumped yet), or
# - the live homepage does not mention the latest tag. The site only shows
#   a tag once a build ran after the release was published; if the version
#   was bumped manually before publishing, the constant matches but the
#   deployed build is still stale and needs an explicit retrigger.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Detect Stale Deployed Site
        id: detect
        run: |
          LATEST_TAG=$(curl -fsSL --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: fastyweb-refresh" \
            "https://api.github.com/repos/diegoleteliers10/fasty/releases/latest" \
            | jq -r '.tag_name // empty')

          if [[ -z "$LATEST_TAG" ]]; then
            echo "Could not read latest fastty release; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TAG=$(grep -o 'FALLBACK_VERSION = "[^"]*"' src/lib/repo.ts | cut -d'"' -f2)

          SITE_FRESH=false
          if SITE_HTML=$(curl -fsSL --max-time 30 "https://fastyterm.vercel.app/"); then
            if grep -qF "$LATEST_TAG" <<<"$SITE_HTML"; then
              SITE_FRESH=true
            fi
          else
            echo "Live site unreachable; assuming it is fresh to avoid an empty rebuild."
            SITE_FRESH=true
          fi

          echo "latest=$LATEST_TAG current=$CURRENT_TAG site_fresh=$SITE_FRESH"

          if [[ "$LATEST_TAG" != "$CURRENT_TAG" ]]; then
            sed -i "s|FALLBACK_VERSION = \"[^\"]*\"|FALLBACK_VERSION = \"$LATEST_TAG\"|" src/lib/repo.ts
          fi

          if [[ "$LATEST_TAG" != "$CURRENT_TAG" || "$SITE_FRESH" != "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Refreshed Version
        if: steps.detect.outputs.changed == 'true'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/repo.ts
          # --allow-empty: when only the live site is stale (fallback already
          # current), the push itself is the rebuild trigger for the host.
          git commit --allow-empty -m "chore(site): refresh for fastty $TAG"
          git pull --rebase origin main
          git push
